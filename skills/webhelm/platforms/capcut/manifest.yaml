platform: capcut
display_name: CapCut
aliases:
- cap-cut
status: partially_verified
last_verified: '2026-10-29'
actions:
  open-editor: actions/_open_editor.py
  inspect-editor: actions/_inspect_editor.py
  models: actions/_models.py
  generate: actions/_generate.py
verification:
  status: partially_verified
  last_verified: '2026-10-29'
  evidence: The live editor URL and semantic snapshot were inspected in WebHelm; adapter actions have not been exercised against the account.
url_patterns:
- https://www.capcut.com/editor*
authentication:
  required: true
  notes: Use the caller's authenticated browser context; never store credentials.
flows:
  open-editor:
    status: unverified
    evidence: The editor URL was inspected live; the adapter action was not run to avoid initializing another blank project.
  inspect-editor:
    status: unverified
    evidence: The editor snapshot was inspected live; the adapter action was not run against the account.
  models:
    status: verified
    evidence: The CLI action listed image and video models live in the authenticated CapCut editor on 2026-10-29.
  generate:
    status: unverified
    evidence: The prompt composer and Generate button were inspected live; generation was not submitted because it can consume account credits.
fields:
  media_type:
    required: true
    type: enum
    values:
    - image
    - video
    implemented: true
  model:
    required: true
    type: string
    note: Use an exact model name returned by the models action.
    implemented: true
  prompt:
    required: true
    type: string
    implemented: true
  confirm_generation:
    required: true
    type: boolean
    default: false
    note: Set true to submit a request that may consume CapCut credits.
    implemented: true
notes:
- Opening the editor may initialize a blank project in the caller's account.
- Generate submits a new image or video to CapCut; generated media remains in the CapCut project.
- Existing timeline editing, reference-media editing, and downloading generated files are not implemented.