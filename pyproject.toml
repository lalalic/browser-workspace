[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-workspace"
dynamic = ["version"]
description = "Agent browser runtime with persistent sessions, tab leasing, and browser automation."
requires-python = ">=3.11"
dependencies = [
  "browser-harness==0.1.13",
  "cdp-use==1.4.5",
  "fetch-use==0.4.0",
  "pillow==12.3.0",
  "PyYAML==6.0.2",
  "websockets==15.0.1",
]

[project.scripts]
webhelm = "browser_workspace_app.cli:main"

[tool.setuptools]
packages = ["browser_workspace_app"]
package-dir = {"browser_workspace_app" = "src"}

[tool.setuptools.dynamic]
version = {attr = "browser_workspace_app.__version__"}

[tool.setuptools.package-data]
browser_workspace_app = ["browser-harness/*.py", "admin.mjs", "licenses/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "skills/webhelm/platforms/chatgpt/runtime"]
addopts = "--import-mode=importlib"
testpaths = ["test", "skills"]
