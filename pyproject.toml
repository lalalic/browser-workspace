[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-workspace"
version = "0.4.0"
description = "Agent browser workspace with persistent Python sessions, tab leasing, snapshots, and platform workflows."
requires-python = ">=3.11"
dependencies = [
  "cdp-use==1.4.5",
  "fetch-use==0.4.0",
  "pillow==12.3.0",
  "PyYAML==6.0.2",
  "websockets==15.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["video-template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
