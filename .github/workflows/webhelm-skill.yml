name: WebHelm Runtime and Skill
on:
  push:
    branches: [main]
    paths: ["runtime/**", "bin/**", "skills/webhelm/**", "test/**", "package*.json", ".github/workflows/webhelm-skill.yml"]
  pull_request:
    paths: ["runtime/**", "bin/**", "skills/webhelm/**", "test/**", "package*.json", ".github/workflows/webhelm-skill.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node bin/webhelm.mjs --help
      - run: npm pack --dry-run
