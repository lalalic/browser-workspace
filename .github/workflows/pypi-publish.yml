name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - 'pypi-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run test suites
        run: |
          uv run --with pytest pytest -q
          node --test test/workspace-manager.test.mjs
      - name: Build wheel and sdist
        run: uv build
      - name: Validate CLI from built wheel
        run: |
          uvx --from dist/*.whl webhelm --help
          WEBHELM_PLATFORM_DIR=skills/webhelm/platforms uvx --from dist/*.whl webhelm platform list
          WEBHELM_PLATFORM_DIR=skills/webhelm/platforms uvx --from dist/*.whl webhelm platform profile chatgpt
          uvx --from dist/*.whl webhelm platform run chatgpt new-turn --help
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distribution
          path: dist/*

      - name: Report failed PyPI build
        if: ${{ failure() }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication-failure@publication-v1
        with:
          token: ${{ github.token }}
          stage: PyPI build and validation
          sha: ${{ github.sha }}
          repository: ${{ github.repository }}

  publish:
    if: startsWith(github.ref, 'refs/tags/pypi-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browser-workspace/
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Resolve published version
        id: publication
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#pypi-v}" >> "$GITHUB_OUTPUT"
      - name: Report successful PyPI publication
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication@publication-v1
        with:
          token: ${{ github.token }}
          artifact: browser-workspace
          version: ${{ steps.publication.outputs.version }}
          channel: pypi
          sha: ${{ github.sha }}
          repository: ${{ github.repository }}
      - name: Report failed PyPI publication
        if: ${{ failure() }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication-failure@publication-v1
        with:
          token: ${{ github.token }}
          stage: PyPI publish workflow
          sha: ${{ github.sha }}
          repository: ${{ github.repository }}
