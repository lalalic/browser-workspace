name: Publish Python distribution to PyPI

on:
  push:
    tags:
      - 'pypi-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync wheel package from canonical Python sources
        run: python tools/sync-pypi-package.py
      - name: Build wheel and sdist
        run: uv build
      - name: Validate CLI from built wheel
        run: |
          uvx --from dist/*.whl browser-workspace --help
          uvx --from dist/*.whl browser-workspace platform profile wechat-channels
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distribution
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/pypi-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browser-workspace/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
