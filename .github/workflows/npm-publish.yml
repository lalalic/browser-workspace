name: Publish Node package to npm

on:
  push:
    tags:
      - 'npm-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Run Node tests
        run: npm test
      - name: Validate package contents
        run: |
          npm pack --dry-run --json > package-report.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package-report.json"))[0]; if (p.files.some(f => f.path.endsWith(".py"))) throw new Error("Python source leaked into npm package"); console.log(`Validated ${p.entryCount} package files`);'
      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/npm-v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
