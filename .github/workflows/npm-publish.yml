name: Publish npm CLI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bin/**"
      - "src/**"
      - "agent-workspace/**"
      - "interaction-skills/**"
      - "platforms/**"
      - "platform_runner.py"
      - "session_client.py"
      - "session_daemon.py"
      - "managed_chrome.py"
      - "extension/**"
      - "pyproject.toml"
      - ".github/workflows/npm-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11.21.0 for trusted publishing
        run: npm install --global npm@11.21.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python runtime and test dependencies
        run: python -m pip install . pytest
      - run: npm test
      - name: Verify package and executable bin
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const p=require("./pack.json")[0]; const f=p.files.find(x=>x.path==="bin/browser-workspace"); if(!f) throw new Error("missing browser-workspace bin"); if(f.mode !== 493) throw new Error(`bin mode ${f.mode} is not executable`);'
      - name: Check whether this version is already published
        id: npm-version
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not published yet."
          fi
      - name: Publish
        if: steps.npm-version.outputs.publish == 'true'
        run: npm publish --access public
